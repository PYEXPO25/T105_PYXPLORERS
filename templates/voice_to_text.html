<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech to Text</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 80%;
      max-width: 500px;
    }

    h1 {
      color: #007bff;
    }

    select, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
      border-radius: 5px;
    }

    button {
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }

    #speechResult {
      font-size: 18px;
      color: #333;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Speech to Text</h1>

    <select id="languageSelect">
      <option value="en-US">English (US)</option>
      <option value="hi-IN">Hindi (India)</option>
      <option value="ta-IN">Tamil (India)</option>
      <option value="te-IN">Telugu (India)</option>
      <option value="bn-IN">Bengali (India)</option>
      <option value="mr-IN">Marathi (India)</option>
      <option value="gu-IN">Gujarati (India)</option>
      <option value="ml-IN">Malayalam (India)</option>
      <option value="pa-IN">Punjabi (India)</option>
      <option value="or-IN">Odia (India)</option>
      <option value="ur-IN">Urdu (India)</option>
    </select>

    <button id="startRecordButton">Start Listening</button>
    <div id="speechResult">Recognized Speech will appear here...</div>
  </div>

  <script>
    let recognition = null;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window) {
      recognition = new webkitSpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let transcript = event.results[event.results.length - 1][0].transcript;
        document.getElementById('speechResult').textContent = transcript;
      };

      recognition.onerror = (event) => {
        console.error('Speech Recognition Error:', event);
      };

      document.getElementById('startRecordButton').addEventListener('click', function() {
        let language = document.getElementById('languageSelect').value;
        recognition.lang = language;

        if (isRecording) {
          recognition.stop();
          this.textContent = 'Start Listening';
        } else {
          recognition.start();
          this.textContent = 'Stop Listening';
        }
        isRecording = !isRecording;
      });

    } else {
      alert("Speech recognition is not supported in your browser.");
    }
  </script>

</body>
</html>
